<title>4 Example Classroom Board</title>
<style>
:root{
  --navy:#0B1F3A; --deep:#06121F; --card:#13294B; --card2:#0E2242; --line:rgba(156,200,255,.28);
  --accent:#5DA9FF; --accent2:#9CC8FF; --text:#F2F6FC; --muted:#A9BCD8; --danger:#FF6B5E;
  --red:#FF5A4E; --yellow:#F5C842; --green:#3DDC84;
  --cell:40px; --ts:1; --track:rgba(255,255,255,.1);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--deep);color:var(--text);
  font-family:Arial,Helvetica,sans-serif;-webkit-user-select:none;user-select:none;
  -webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;touch-action:manipulation}
button{font-family:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
input,textarea,select{font-family:inherit;-webkit-user-select:text;user-select:text}
svg{display:block}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#board{position:relative;overflow:hidden;background-color:var(--navy);flex:none}
#bgphoto{position:absolute;inset:0;background-size:cover;background-position:center;pointer-events:none}
#gridlayer{position:absolute;inset:0;pointer-events:none}
#axes{position:absolute;inset:0;pointer-events:none}
#axes div{position:absolute;background:var(--accent2);opacity:.75}
#widgets{position:absolute;inset:0}
#ink{position:absolute;inset:0;pointer-events:none;z-index:5000}
body.drawing #ink{pointer-events:auto;touch-action:none;cursor:crosshair}
#empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;pointer-events:none;text-align:center;padding:20px}
#empty button{pointer-events:auto;width:84px;height:84px;border-radius:50%;border:0;background:var(--accent);color:var(--navy);font-size:48px;line-height:1;box-shadow:0 10px 30px rgba(0,0,0,.4)}
#empty .t1{font-size:22px;font-weight:500}
#empty .t2{font-size:15px;color:var(--muted)}
body.present #empty{display:none}

/* ---------- widget frame ---------- */
.wg{position:absolute;display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);
  border-radius:16px;box-shadow:0 10px 28px rgba(0,0,0,.38);overflow:hidden;transition:box-shadow .15s}
.wg.sel{outline:3px solid var(--accent);outline-offset:1px}
.wg.dragging{box-shadow:0 20px 50px rgba(0,0,0,.55);transition:none;opacity:.96}
.wg.clear{background:transparent;border-color:transparent;box-shadow:none}
.wg.clear.sel,.wg.clear:hover{border-color:var(--line)}
.wg-head{flex:none;height:34px;display:flex;align-items:center;gap:4px;padding:0 4px 0 12px;color:var(--muted);
  font-size:12px;font-weight:500;letter-spacing:.05em;text-transform:uppercase;touch-action:none;cursor:grab}
.wg-title{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
.wg-tools{display:none;gap:2px}
.wg.sel .wg-tools{display:flex}
.wg-tools button{width:32px;height:30px;border:0;border-radius:8px;background:rgba(255,255,255,.06);display:flex;align-items:center;justify-content:center;color:var(--accent2);padding:0}
.wg-tools button:hover{background:rgba(255,255,255,.14)}
.wg-tools button.del{color:#FF9A90}
.wg-gear{width:32px;height:30px;border:0;border-radius:8px;background:transparent;color:var(--muted);display:flex;align-items:center;justify-content:center;padding:0}
.wg.sel .wg-gear{display:none}
.wg-body{position:relative;flex:1;min-height:0;container-type:size;overflow:hidden}
.wg-rs{position:absolute;right:0;bottom:0;width:40px;height:40px;touch-action:none;cursor:nwse-resize;z-index:3}
.wg-rs::after{content:"";position:absolute;right:5px;bottom:5px;width:14px;height:14px;border-right:3px solid var(--accent2);border-bottom:3px solid var(--accent2);border-radius:0 0 6px 0;opacity:.55}
.wg.sel .wg-rs::after{opacity:1;border-color:var(--accent)}
body.locked .wg-rs,body.present .wg-rs{display:none}
body.locked .wg-head{cursor:default}
body.locked .wg-tools .lk{display:none}
body.present .wg-head{display:none}
body.present .wg.sel{outline:none}
body.present .edit-only{display:none!important}
body.drawing .wg{pointer-events:none}

/* ---------- shared widget pieces ---------- */
.fill{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.big{font-weight:600;font-variant-numeric:tabular-nums;line-height:1;letter-spacing:-.01em}
.muted{color:var(--muted)}
.ctl{display:flex;gap:min(2cqmin,8px);justify-content:center;flex-wrap:wrap}
.b{min-height:36px;min-width:44px;border-radius:12px;border:1px solid rgba(156,200,255,.4);background:transparent;color:#DCE8F8;
  font-size:max(13px,min(5cqmin,20px));padding:0 max(10px,2.4cqmin);display:inline-flex;align-items:center;justify-content:center;gap:6px}
.b.on,.b.pri{background:var(--accent);border-color:var(--accent);color:var(--navy);font-weight:600}
.b:active{transform:scale(.97)}
.b.sm{min-height:32px;min-width:36px;font-size:13px;padding:0 8px}
.inp{min-height:40px;border-radius:10px;border:1px solid rgba(156,200,255,.4);background:var(--navy);color:var(--text);font-size:15px;padding:0 10px;width:100%}

/* text */
.txt{position:absolute;inset:0;padding:calc(var(--cell)*.35) calc(var(--cell)*.45);overflow:auto;outline:none;
  font-size:calc(var(--cell)*.62*var(--ts)*var(--fs,1));line-height:1.35;-webkit-user-select:text;user-select:text;white-space:pre-wrap;word-wrap:break-word}
[data-ph]:empty::before{content:attr(data-ph);color:var(--muted);opacity:.75;pointer-events:none}
.txt-bar{position:absolute;left:6px;right:6px;top:4px;display:none;gap:4px;flex-wrap:wrap;z-index:4;background:rgba(6,18,31,.92);border-radius:10px;padding:4px}
.wg.editing .txt-bar{display:flex}
.wg.editing .txt{padding-top:52px}
body.present .txt-bar{display:none!important}
.txt-bar button{min-width:38px;height:36px;border:0;border-radius:8px;background:rgba(255,255,255,.08);color:var(--text);font-size:15px;padding:0 8px}
.frac{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;font-size:.82em;margin:0 .12em;line-height:1.1}
.frac .num{border-bottom:.08em solid currentColor;padding:0 .15em;min-width:.6em}
.frac .den{padding:0 .15em;min-width:.6em}
.sqrt{white-space:nowrap}
.sqrt .rad{border-top:.07em solid currentColor;padding:0 .1em;margin-left:.02em}
.sym-pop{position:absolute;top:44px;left:6px;z-index:6;background:#081426;border:1px solid var(--line);border-radius:12px;padding:6px;display:grid;grid-template-columns:repeat(6,40px);gap:4px}
.sym-pop button{height:40px;border:0;border-radius:8px;background:rgba(255,255,255,.08);color:var(--text);font-size:18px}

/* ---------- dock ---------- */
#dock{position:fixed;left:50%;bottom:max(12px,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:9000;display:flex;align-items:center;gap:2px;
  background:rgba(6,16,30,.94);border:1px solid rgba(156,200,255,.3);border-radius:20px;padding:5px 8px;box-shadow:0 12px 30px rgba(0,0,0,.45);max-width:calc(100vw - 16px);overflow-x:auto;scrollbar-width:none}
#dock::-webkit-scrollbar{display:none}
#dock button{flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-width:58px;height:54px;border:0;background:transparent;color:#DCE8F8;font-size:11px;border-radius:12px;padding:4px}
#dock button:hover{background:rgba(255,255,255,.08)}
#dock button.on{background:var(--accent);color:var(--navy);font-weight:600}
#dock button:disabled{opacity:.35}
#dock .sep{width:1px;height:34px;background:rgba(156,200,255,.25);margin:0 4px;flex:none}
body.present #dock,body.present #inkbar{display:none}
#dockToggle{display:none}
#exitPresent{position:fixed;top:10px;right:10px;z-index:9500;display:none;border:0;border-radius:12px;background:rgba(6,16,30,.7);color:#DCE8F8;font-size:13px;padding:10px 14px;opacity:.18;transition:opacity .2s}
#exitPresent:hover,#exitPresent:focus,#exitPresent.peek{opacity:1}
body.present #exitPresent{display:block}

#inkbar{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);z-index:9000;display:none;gap:6px;align-items:center;background:rgba(6,16,30,.96);border:1px solid rgba(156,200,255,.3);border-radius:16px;padding:6px 10px}
body.drawing #inkbar{display:flex}
#inkbar .sw{width:34px;height:34px;border-radius:50%;border:3px solid transparent;padding:0}
#inkbar .sw.on{border-color:#fff;box-shadow:0 0 0 2px var(--accent)}

/* ---------- sheets ---------- */
.scrim{position:fixed;inset:0;z-index:9800;background:rgba(2,8,16,.45);display:flex;justify-content:flex-end}
.sheet{width:min(440px,100vw);height:100%;background:#0D213F;border-left:1px solid var(--line);display:flex;flex-direction:column;box-shadow:-20px 0 40px rgba(0,0,0,.4);
  animation:slin .18s ease-out;-webkit-user-select:none;user-select:none}
.sheet.wide{width:min(620px,100vw)}
@keyframes slin{from{transform:translateX(30px);opacity:.4}to{transform:none;opacity:1}}
.sheet-h{flex:none;display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid rgba(156,200,255,.15)}
.sheet-h h2{margin:0;font-size:19px;font-weight:600}
.sheet-b{flex:1;overflow:auto;padding:8px 16px 40px;-webkit-overflow-scrolling:touch}
.sec{font-size:12px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;font-weight:500;margin:18px 0 8px}
.fld{display:flex;flex-direction:column;gap:6px;margin:10px 0;font-size:14px;color:#DCE8F8}
.fld textarea{min-height:110px;border-radius:10px;border:1px solid rgba(156,200,255,.4);background:var(--navy);color:var(--text);font-size:15px;padding:10px;resize:vertical;line-height:1.4}
.row{display:flex;align-items:center;gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips .b{font-size:14px;min-height:40px}
.tog{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:46px;font-size:15px}
.switch{width:52px;height:30px;border-radius:15px;background:rgba(255,255,255,.18);position:relative;border:0;flex:none;padding:0}
.switch::after{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .15s}
.switch.on{background:var(--accent)}
.switch.on::after{left:25px}
.note{font-size:13px;color:var(--muted);line-height:1.45;margin:8px 0}
.item{display:flex;align-items:center;gap:8px;background:var(--navy);border-radius:12px;padding:8px 10px;margin:6px 0}
.item .grow{flex:1;min-width:0}
.item .nm{font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .sub{font-size:12px;color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px}
.tile{min-height:88px;border-radius:14px;border:1px solid rgba(156,200,255,.3);background:var(--navy);color:#DCE8F8;font-size:13px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:8px;text-align:center}
.tile:hover{border-color:var(--accent)}
.tile svg{color:var(--accent2)}
.bgs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.bgs button{width:100%;height:120px;border-radius:14px;border:4px solid rgba(156,200,255,.25);padding:0;position:relative;overflow:hidden}
.bgs button.on{border-color:var(--accent);box-shadow:0 0 0 3px rgba(93,169,255,.35)}
.bgs span{display:block;font-size:16px;font-weight:500;color:#F2F6FC;margin-top:6px;text-align:center}
input[type=range]{width:100%;accent-color:var(--accent)}

/* ---------- toast / popup / tour ---------- */
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);z-index:9900;background:#F2F6FC;color:var(--navy);font-size:15px;font-weight:500;
  padding:10px 18px;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center}
#toast.show{opacity:1}
#popup{position:fixed;left:50%;top:24px;transform:translateX(-50%);z-index:9950;width:min(860px,94vw);display:none;align-items:center;gap:22px;background:#F2C94C;color:#2B2200;
  border-radius:22px;padding:22px 26px;box-shadow:0 20px 50px rgba(0,0,0,.5);animation:pop .35s cubic-bezier(.2,1.4,.4,1)}
#popup.show{display:flex}
@keyframes pop{from{transform:translate(-50%,-30px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
#popup .pt{font-size:13px;font-weight:600;letter-spacing:.05em;text-transform:uppercase}
#popup .pm{font-size:clamp(22px,4vw,40px);font-weight:600;line-height:1.15}
#popup button{min-height:46px;min-width:120px;border-radius:12px;font-size:15px;font-weight:600}
#tour{position:fixed;inset:0;z-index:9990;background:rgba(2,8,16,.6);display:none;align-items:center;justify-content:center;padding:20px}
#tour.show{display:flex}
#tour .card{width:min(520px,100%);background:#0D213F;border:1px solid var(--line);border-radius:22px;padding:28px;box-shadow:0 30px 60px rgba(0,0,0,.5)}
#tour h3{margin:6px 0 10px;font-size:26px}
#tour p{margin:0;font-size:17px;line-height:1.5;color:#DCE8F8}
#tour .dots{display:flex;gap:6px}
#tour .dots i{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.25)}
#tour .dots i.on{background:var(--accent)}
.flash{animation:flash 1s steps(2) infinite}
@keyframes flash{50%{filter:brightness(1.35)}}

.wg:not(.sel) .tpre{display:none!important}

.wg{color:var(--text)}
.wg.lightcard{--text:#0B1F3A;--muted:#3E5272;--accent2:#1D4F86;--track:rgba(11,31,58,.13)}
.wg.lightcard .b{color:#0B1F3A;border-color:rgba(11,31,58,.35)}
.wg.lightcard .b.on,.wg.lightcard .b.pri{color:#0B1F3A;border-color:var(--accent)}
.wg.lightcard .wg-tools button{background:rgba(11,31,58,.08);color:#1D4F86}
.cp{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0}
.cp .sw{width:40px;height:40px;border-radius:50%;border:3px solid rgba(255,255,255,.25);padding:0;flex:none}
.cp .sw.on{border-color:#fff;box-shadow:0 0 0 3px var(--accent)}
.cp input[type=color]{width:56px;height:44px;border:2px solid rgba(156,200,255,.5);border-radius:12px;background:transparent;padding:2px;cursor:pointer}
.cp .lbl{font-size:13px;color:var(--muted);width:100%}

</style>

      var pattern = 0;

        if (i == 0 || minLostPoint > lostPoint) {

        }

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              } else {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

        break;

        break;

        break;

          for (var i = 0; i < rsBlocks.length; i++) {

        for (var c = 0; c < _this.getModuleCount(); c += 1) {

          qrHtml += ' border-width: 0px; border-style: none;';
          qrHtml += ' border-collapse: collapse;';
          qrHtml += ' padding: 0px; margin: 0px;';
          qrHtml += ' width: ' + cellSize + 'px;';
          qrHtml += ' height: ' + cellSize + 'px;';

      var max = size - margin;

        if (min <= x && x < max && min <= y && y < max) {

          var r = Math.floor( (y - min) / cellSize);

        }

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      img += '\u0020src="';
      img += _this.createDataURL(cellSize, margin);
      img += '"';
      img += '\u0020width="';
      img += size;
      img += '"';
      img += '\u0020height="';
      img += size;
      img += '"';
      if (alt) {
        img += '\u0020alt="';
        img += escapeXml(alt);
        img += '"';
      }
      img += '/>';

      return img;
    };

    var escapeXml = function(s) {
      var escaped = '';
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charAt(i);
        switch(c) {
        case '<': escaped += '&lt;'; break;
        case '>': escaped += '&gt;'; break;
        case '&': escaped += '&amp;'; break;
        case '"': escaped += '&quot;'; break;
        default : escaped += c; break;
        }
      }
      return escaped;
    };

    var _createHalfASCII = function(margin) {
      var cellSize = 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r1, r2, p;

      var blocks = {
        '██': '█',
        '█ ': '▀',
        ' █': '▄',
        '  ': ' '
      };

        '██': '▀',
        '█ ': '▀',
        ' █': ' ',
        '  ': ' '
      };

      var ascii = '';
      for (y = 0; y < size; y += 2) {

        r2 = Math.floor((y + 1 - min) / cellSize);
        for (x = 0; x < size; x += 1) {

          if (min <= x && x < max && min <= y && y < max && _this.isDark(r1, Math.floor((x - min) / cellSize))) {

          }

          if (min <= x && x < max && min <= y+1 && y+1 < max && _this.isDark(r2, Math.floor((x - min) / cellSize))) {

          else {
            p += '█';

      const u = Math.min((Wd - 2 * pad) / xr, (Hd - 2 * pad) / yr);
      const x0 = (Wd - u * xr) / 2, y0 = (Hd - u * yr) / 2;
      const X = x => x0 + (x - p.xmin) * u, Y = y => y0 + (p.ymax - y) * u;
      geo = { X, Y, u, x0, y0 };
      const ink = p.light ? '#0B1F3A' : '#F2F6FC', grid = p.light ? '#D6E3F3' : 'rgba(156,200,255,.18)', gridM = p.light ? '#A9C2E3' : 'rgba(156,200,255,.32)';
      let g = '';
      const st = p.step, first = v => Math.ceil(v / st - 1e-9) * st;
      for (let x = first(p.xmin); x <= p.xmax + 1e-9; x += st) g += '<line x1="' + X(x) + '" y1="' + Y(p.ymin) + '" x2="' + X(x) + '" y2="' + Y(p.ymax) + '" stroke="' + (Math.round(x / st) % 5 === 0 ? gridM : grid) + '" stroke-width="1"/>';
      for (let y = first(p.ymin); y <= p.ymax + 1e-9; y += st) g += '<line x1="' + X(p.xmin) + '" y1="' + Y(y) + '" x2="' + X(p.xmax) + '" y2="' + Y(y) + '" stroke="' + (Math.round(y / st) % 5 === 0 ? gridM : grid) + '" stroke-width="1"/>';
      const ax = clamp(0, p.xmin, p.xmax), ay = clamp(0, p.ymin, p.ymax);
      g += '<line x1="' + X(p.xmin) + '" y1="' + Y(ay) + '" x2="' + X(p.xmax) + '" y2="' + Y(ay) + '" stroke="' + ink + '" stroke-width="2"/><line x1="' + X(ax) + '" y1="' + Y(p.ymin) + '" x2="' + X(ax) + '" y2="' + Y(p.ymax) + '" stroke="' + ink + '" stroke-width="2"/>';
      const fsz = clamp(u * st * .42, 9, 16);
      if (p.nums) {
        const k = Math.max(1, Math.ceil(22 / (u * st)));
        const lab = v => String(Math.round(v * 1000) / 1000).replace('-', '−');
        for (let x = first(p.xmin), j = 0; x <= p.xmax + 1e-9; x += st, j++) { if (Math.abs(x) < 1e-9 || Math.round(x / st) % k) continue; g += '<text x="' + X(x) + '" y="' + (Y(ay) + fsz + 3) + '" font-size="' + fsz + '" fill="' + ink + '" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" opacity=".8">' + lab(x) + '</text>'; }
        for (let y = first(p.ymin); y <= p.ymax + 1e-9; y += st) { if (Math.abs(y) < 1e-9 || Math.round(y / st) % k) continue; g += '<text x="' + (X(ax) - 5) + '" y="' + (Y(y) + fsz * .35) + '" font-size="' + fsz + '" fill="' + ink + '" text-anchor="end" font-family="Arial,Helvetica,sans-serif" opacity=".8">' + lab(y) + '</text>'; }
      }
      p.eqs.split('\n').forEach((line, i) => {
        const e = parseEq(line); if (!e) return; const col = PLANE_COLORS[i % PLANE_COLORS.length];
        if (e.vx != null) { g += '<line x1="' + X(e.vx) + '" y1="' + Y(p.ymin) + '" x2="' + X(e.vx) + '" y2="' + Y(p.ymax) + '" stroke="' + col + '" stroke-width="3"/>'; return; }
        let d = '', pen = false; const N = 600, lim = yr * 4;
        for (let k = 0; k <= N; k++) {
          const x = p.xmin + xr * k / N; let y; try { y = e.f(x); } catch (er) { y = NaN; }
          if (!isFinite(y) || y > p.ymax + lim || y < p.ymin - lim) { pen = false; continue; }
          const sx = X(x).toFixed(1), sy = Y(clamp(y, p.ymin - yr, p.ymax + yr)).toFixed(1);
          d += (pen ? 'L' : 'M') + sx + ' ' + sy; pen = true;
        }
        if (d) g += '<path d="' + d + '" fill="none" stroke="' + col + '" stroke-width="3" stroke-linejoin="round" clip-path="url(#pc' + api.w.id + ')"/>';
      });
      const r = clamp(u * .18, 4, 9);
      p.points.forEach(q => {
        g += '<circle cx="' + X(q.x) + '" cy="' + Y(q.y) + '" r="' + r + '" fill="#F5C842" stroke="' + (p.light ? '#0B1F3A' : '#0B1F3A') + '" stroke-width="2"/>';
        const t = (q.l ? q.l + ' ' : '') + (p.coords ? '(' + q.x + ', ' + q.y + ')' : '');
        if (t) g += '<text x="' + (X(q.x) + r + 3) + '" y="' + (Y(q.y) - r - 2) + '" font-size="' + clamp(fsz * 1.15, 11, 20) + '" font-weight="600" fill="' + ink + '" font-family="Arial,Helvetica,sans-serif" paint-order="stroke" stroke="' + (p.light ? '#fff' : '#13294B') + '" stroke-width="4">' + t.replace(/-/g, '−').replace(/[<>&]/g, '') + '</text>';
      });
      svgBox.innerHTML = '<svg width="' + Wd + '" height="' + Hd + '" role="img" aria-label="Coordinate plane"><defs><clipPath id="pc' + api.w.id + '"><rect x="' + X(p.xmin) + '" y="' + Y(p.ymax) + '" width="' + (xr * u) + '" height="' + (yr * u) + '"/></clipPath></defs>' + g + '</svg>';
    }
    svgBox.addEventListener('click', e => {
      if (!plot || !geo) return; e.stopPropagation();
      const r = svgBox.getBoundingClientRect(); const st = p.step;
      const x = Math.round(((e.clientX - r.left - geo.x0) / geo.u + p.xmin) / st) * st, y = Math.round((p.ymax - (e.clientY - r.top - geo.y0) / geo.u) / st) * st;
      const rx = +x.toFixed(3), ry = +y.toFixed(3);
      if (rx < p.xmin || rx > p.xmax || ry < p.ymin || ry > p.ymax) return;
      const hit = p.points.findIndex(q => Math.abs(q.x - rx) < st / 2 && Math.abs(q.y - ry) < st / 2);
      if (hit >= 0) p.points.splice(hit, 1);
      else { const used = new Set(p.points.map(q => q.l)); let l = ''; for (let c = 65; c < 91; c++) if (!used.has(String.fromCharCode(c))) { l = String.fromCharCode(c); break; } p.points.push({ x: rx, y: ry, l }); }
      api.save(); draw();
    });
    requestAnimationFrame(draw);
    return { onResize: draw };
  },
  settings(f, p) {
    f.sec('Window');
    f.node(h('div', { class: 'row', style: { flexWrap: 'wrap' } }, ['xmin', 'xmax', 'ymin', 'ymax', 'step'].map(k => { const i = h('input', { class: 'inp', type: 'number', step: 'any', value: String(p[k]) }); i.addEventListener('change', () => { const v = parseFloat(i.value); if (isFinite(v)) { p[k] = v; W.plane.clean(p); f.fire(); } }); return h('label', { class: 'fld', style: { width: '30%', minWidth: '90px' } }, { xmin: 'x min', xmax: 'x max', ymin: 'y min', ymax: 'y max', step: 'Grid step' }[k], i); })));
    f.buttons([['−10 to 10', () => { Object.assign(p, { xmin: -10, xmax: 10, ymin: -10, ymax: 10, step: 1 }); f.fire(); }], ['First quadrant 0–10', () => { Object.assign(p, { xmin: 0, xmax: 10, ymin: 0, ymax: 10, step: 1 }); f.fire(); }], ['−5 to 5', () => { Object.assign(p, { xmin: -5, xmax: 5, ymin: -5, ymax: 5, step: 1 }); f.fire(); }]]);
    f.sec('Graph lines and curves');
    f.area('Equations (one per line)', () => p.eqs, v => p.eqs = v.slice(0, 600), 'y = 2x + 1\ny = -x + 7\nx = 3', 4);
    f.note('Use x as the variable: 2x + 1, -1/2x + 3, x^2 - 4, |x|, sqrt(x).');
    f.sec('Points');
    f.area('Points (one per line, like A (2, 3))', () => p.points.map(q => (q.l ? q.l + ' ' : '') + '(' + q.x + ', ' + q.y + ')').join('\n'), v => {
      p.points = v.split('\n').map(line => { const m = line.match(/^\s*([A-Za-z]\w{0,4})?\s*\(?\s*(-?[\d.]+)\s*,\s*(-?[\d.]+)\s*\)?/); return m ? { l: m[1] || '', x: +m[2], y: +m[3] } : null; }).filter(Boolean).slice(0, 60);
    }, 'A (2, 3)\nB (-4, 1)', 4);
    f.note('Or tap “Plot points” on the widget and tap the grid. Tap a point again to remove it.');
    f.toggle('Show axis numbers', () => p.nums, v => p.nums = v);
    f.toggle('Show coordinates next to points', () => p.coords, v => p.coords = v);
    f.toggle('White background', () => p.light, v => p.light = v);
  }
};

/* ===== Desmos & YouTube ===== */
function embedMount(b, p, api, kind) {
  const isD = kind === 'desmos';
  const parse = () => {
    const u = (p.url || '').trim();
    if (isD) { const m = u.match(/desmos\.com\/(calculator|geometry|3d|scientific|fourfunction|matrix)(?:\/([A-Za-z0-9]+))?/i); if (m) return { src: 'https://www.desmos.com/' + m[1].toLowerCase() + (m[2] ? '/' + m[2] : '') + '?embed', open: 'https://www.desmos.com/' + m[1].toLowerCase() + (m[2] ? '/' + m[2] : '') }; return u ? null : { src: 'https://www.desmos.com/calculator?embed', open: 'https://www.desmos.com/calculator' }; }
    const m = u.match(/(?:youtu\.be\/|v=|\/embed\/|\/shorts\/|\/live\/)([A-Za-z0-9_-]{11})/); return m ? { src: 'https://www.youtube-nocookie.com/embed/' + m[1] + '?rel=0&playsinline=1', open: 'https://www.youtube.com/watch?v=' + m[1] } : null;
  };
  const t = parse();
  const inp = h('input', { class: 'inp', placeholder: isD ? 'Paste a Desmos graph link (optional)' : 'Paste a YouTube link', value: p.url || '' });
  const setUrl = () => { p.url = inp.value.trim().slice(0, 500); api.save(); api.remount(); };
  inp.addEventListener('keydown', e => { if (e.key === 'Enter') setUrl(); });
  const urlRow = editOnly(h('div', { class: 'row', style: { width: '100%' } }, inp, btn('Use', setUrl, 'pri')));
  if (!t || (!isD && !p.url)) {
    b.appendChild(h('div', { class: 'fill', style: { gap: '3cqh', padding: '5cqmin', textAlign: 'center' } }, h('div', { class: 'muted', style: { fontSize: '15px' } }, p.url ? 'That doesn’t look like a ' + (isD ? 'Desmos' : 'YouTube') + ' link.' : (isD ? 'Paste a link to a saved Desmos graph.' : 'Paste a YouTube link to play a video on the board.')), urlRow));
    return;
  }
  if (FRAMED) {
    b.appendChild(h('div', { class: 'fill', style: { gap: '2.5cqh', padding: '5cqmin', textAlign: 'center' } },
      h('div', { style: { fontSize: fs(6, 10), fontWeight: 600 } }, isD ? (p.url ? 'Desmos graph' : 'Desmos calculator') : 'YouTube video'),
      h('a', { href: t.open, target: '_blank', rel: 'noopener', class: 'b pri', style: { textDecoration: 'none' } }, 'Open ' + (isD ? 'in Desmos' : 'on YouTube'), icon('ext', 16)),
      h('div', { class: 'muted', style: { fontSize: '13px', lineHeight: 1.4, maxWidth: '520px' } }, (isD ? 'Desmos' : 'Videos') + ' can’t play inside the Claude page. Once the board runs on its own website, this plays right here on the board.'),
      urlRow));
    return;
  }
  const fr = h('iframe', { src: t.src, title: isD ? 'Desmos' : 'YouTube video', style: { position: 'absolute', inset: 0, width: '100%', height: '100%', border: 0, background: '#fff' }, allow: isD ? 'fullscreen' : 'accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture; fullscreen', referrerpolicy: 'strict-origin-when-cross-origin' });
  b.appendChild(fr);
}
W.desmos = {
  title: 'Desmos', icon: 'graph', size: [15, 11], min: [6, 5],
  defaults: () => ({ url: '' }), clean(p) { p.url = safeStr(p.url, 500); },
  mount: (b, p, api) => embedMount(b, p, api, 'desmos'),
  settings(f, p) { f.text('Desmos link (leave blank for a blank graphing calculator)', () => p.url, v => p.url = v.trim().slice(0, 500), 'https://www.desmos.com/calculator/…'); f.note('In Desmos, tap Share › copy the link, then paste it here.'); }
};
W.youtube = {
  title: 'YouTube', label: 'YouTube video', icon: 'play', size: [14, 9], min: [5, 4],
  defaults: () => ({ url: '' }), clean(p) { p.url = safeStr(p.url, 500); },
  mount: (b, p, api) => embedMount(b, p, api, 'youtube'),
  settings(f, p) { f.text('YouTube link', () => p.url, v => p.url = v.trim().slice(0, 500), 'https://youtu.be/…'); }
};

boot();
</script>
